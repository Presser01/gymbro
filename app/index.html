<!doctype html>
<html lang="hu" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-ZZDtcIiQjfqG81IXGXTAm5oQVX6w9JX6uVXtKn0Za2w='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://fdrobsnhcmnabksjkegw.supabase.co; connect-src 'self' https://fdrobsnhcmnabksjkegw.supabase.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; worker-src 'self' blob:; manifest-src 'self'">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Raidmate">
<meta property="og:title" content="Webes nézet">
<meta property="og:url" content="https://presser01.github.io/gymbro/app/">
<meta property="og:image" content="https://presser01.github.io/gymbro/assets/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Webes nézet</title>
<link rel="icon" href="../assets/logo-192.png">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/icons.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="notebook.css">
<link rel="stylesheet" href="themes.css">
<script>
  // A téma már az első kirajzolás előtt (ne villanjon), mint a főoldalon.
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t !== 'light' && t !== 'dark') {
      try { t = localStorage.getItem('theme'); } catch (e) {}
    }
    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
    // Stílus: a böngészőben választott, különben az app legutóbbi stílusa
    // (a mentésből megjegyezve), hogy belépés előtt se villanjon. A Viking
    // és az OLED csak sötét.
    var q = new URLSearchParams(location.search);
    var s = q.get('style'), pen = q.get('pen');
    var styles = ['plain', 'notebook', 'viking', 'oled'];
    try {
      if (styles.indexOf(s) < 0) s = localStorage.getItem('style') || localStorage.getItem('appStyle');
      if (pen !== 'graphite' && pen !== 'blue') pen = localStorage.getItem('pen');
    } catch (e) {}
    if (s === 'notebook') {
      document.documentElement.dataset.style = 'notebook';
      document.documentElement.dataset.pen = pen === 'graphite' ? 'graphite' : 'blue';
    } else if (s === 'viking' || s === 'oled') {
      document.documentElement.dataset.style = s;
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>
</head>
<body>
<!-- A Füzet stílus rajzeszközei: remegő tollvonal és satírozás. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="nb-sketch" x="-5%" y="-20%" width="110%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="nb-sketch-soft" x="-2%" y="-10%" width="104%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="1" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <pattern id="nb-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <line x1="0" y1="0" x2="0" y2="5" style="stroke: var(--ink); stroke-width: 1.6"/>
  </pattern>
</svg>
<header class="top">
  <a class="logo" href="../"><img src="../assets/logo-192.png" alt=""><span data-brand>Raidmate</span></a>
  <span class="backup-at" id="backupAt" hidden></span>
  <div class="tools">
    <div class="settings">
      <button class="icon-btn" type="button" id="settingsBtn" aria-haspopup="true" aria-expanded="false" aria-controls="settingsMenu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94a7.4 7.4 0 0 0 .05-.94 7.4 7.4 0 0 0-.05-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54a7 7 0 0 0-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.4 7.4 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .61.22l2.39-.96c.5.38 1.04.7 1.62.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96a.5.5 0 0 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
      <div class="menu" id="settingsMenu" hidden>
        <label><span data-t="menuStyle">Stílus</span><select id="styleSelect"></select></label>
        <label><span data-t="menuTheme">Téma</span><select id="themeSelect"></select></label>
        <p class="menu-note" id="themeNote" hidden></p>
        <label><span data-t="menuLang">Nyelv</span><select id="langSelect"></select></label>
      </div>
    </div>
    <button class="icon-btn" type="button" id="refresh" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
    <button class="btn small" type="button" id="logout" hidden data-t="logout">Kilépés</button>
  </div>
</header>

<main class="login" id="login">
  <form class="card login-card" id="loginForm" autocomplete="on">
    <span class="mi i-lock lock"></span>
    <h1 data-t="loginTitle">Naplóm a weben</h1>
    <p class="muted" data-t="loginLead"></p>
    <label><span data-t="email">E-mail-cím</span>
      <input name="email" type="email" autocomplete="username" required>
    </label>
    <label><span data-t="password">Jelszó</span>
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn primary" type="submit" data-t="login">Belépés</button>
    <p class="status" id="loginStatus" role="status" aria-live="polite"></p>
    <p class="muted small" data-t="loginNote"></p>
    <p class="small"><a href="../" data-t="back">← Vissza</a></p>
  </form>
</main>

<div class="app" id="app" hidden>
  <nav class="side" aria-label="menu">
    <a href="#log" data-view="log" data-label="navLog"><span class="mi i-fitness-center"></span><span></span></a>
    <a href="#stats" data-view="stats" data-label="navStats"><span class="mi i-insights"></span><span></span></a>
    <a href="#diet" data-view="diet" data-label="navDiet"><span class="mi i-restaurant-menu"></span><span></span></a>
    <a href="#medals" data-view="medals" data-label="navMedals"><span class="mi i-emoji-events"></span><span></span></a>
  </nav>
  <section class="content" id="content" aria-live="polite"></section>
</div>
<nav class="tabs" id="tabs" hidden aria-label="menu">
  <a href="#log" data-view="log" data-label="navLog"><span class="mi i-fitness-center"></span><span></span></a>
  <a href="#stats" data-view="stats" data-label="navStats"><span class="mi i-insights"></span><span></span></a>
  <a href="#diet" data-view="diet" data-label="navDiet"><span class="mi i-restaurant-menu"></span><span></span></a>
  <a href="#medals" data-view="medals" data-label="navMedalsShort"><span class="mi i-emoji-events"></span><span></span></a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="../brand.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
