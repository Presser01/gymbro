<!doctype html>
<html lang="hu" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edzők – {brand}</title>
<meta name="description" content="Személyi edzők és online coachok a GymBro edzőkeresőjében: város, edzőterem, szakterület, nyelv és ár szerint.">
<link rel="icon" href="../assets/logo.png">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/icons.css">
<script>
  // A téma már az első kirajzolás előtt (ne villanjon).
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t !== 'light' && t !== 'dark') {
      try { t = localStorage.getItem('theme'); } catch (e) {}
    }
    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* A bemutató oldal színei és betűi (index.html). */
  :root, [data-theme="dark"] {
    --bg: #0d0e10; --bg2: #121317; --card: #1a1b20; --line: #2a2b31;
    --text: #f3f3f5; --muted: #9b9ca3; --soft: #c9cad0; --header: rgba(13,14,16,.82);
    --red: #e5484d; --red2: #ff6b5b; --green: #2ec56b;
    --cta-bg: var(--red); --cta-fg: #fff; --cta-hover: var(--red2);
    --chip: rgba(255,255,255,.06);
    --head: "Barlow Condensed", Barlow, sans-serif; --head-weight: 700;
    --head-case: uppercase; --head-spacing: -.01em;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #fbfbfc; --bg2: #f2f2f4; --card: #ffffff; --line: #e6e6ea;
    --text: #111214; --muted: #66676e; --soft: #3d3e44; --header: rgba(251,251,252,.86);
    --cta-bg: #111214; --cta-fg: #fff; --cta-hover: #2b2c31;
    --chip: rgba(0,0,0,.05);
    --head: Barlow, system-ui, sans-serif; --head-weight: 600;
    --head-case: none; --head-spacing: -.02em;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.6 Barlow, system-ui, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  h1, h2, h3 { font-family: var(--head); font-weight: var(--head-weight); letter-spacing: var(--head-spacing);
               line-height: 1.05; margin: 0; }
  h1, h2 { text-transform: var(--head-case); }
  .eyebrow { color: var(--red); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; }
  .mi { width: 22px; height: 22px; }

  header { position: sticky; top: 0; z-index: 10; background: var(--header);
           backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none;
          font-family: "Barlow Condensed"; font-weight: 700; font-size: 24px; letter-spacing: .02em; }
  .logo img { width: 34px; height: 34px; border-radius: 9px; }
  nav { margin-left: auto; display: flex; gap: 20px; align-items: center; font-weight: 600; font-size: 15px; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a:hover { color: var(--text); }
  .icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;
              border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; padding: 0; }
  .icon-btn:hover { background: var(--bg2); }
  .lang-btn { font: 600 14px Barlow, sans-serif; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 6px; }
  .lang-btn:hover { color: var(--text); }
  [data-theme="dark"] .only-light, [data-theme="light"] .only-dark { display: none; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px;
         font: 700 15px Barlow, sans-serif; text-decoration: none; border: 1.5px solid var(--line);
         background: transparent; color: var(--text); cursor: pointer; }
  [data-theme="light"] .btn { border-radius: 12px; }
  .btn.primary { background: var(--cta-bg); border-color: var(--cta-bg); color: var(--cta-fg); }
  .btn.primary:hover { background: var(--cta-hover); }

  .intro { padding: 48px 0 20px; }
  .intro h1 { font-size: clamp(40px, 6vw, 72px); }
  .intro p { color: var(--soft); max-width: 60ch; margin: 14px 0 0; }

  /* szűrők */
  .filters { display: grid; grid-template-columns: 2fr repeat(3, 1fr); gap: 10px; margin: 18px 0 8px; }
  .filters label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .filters input, .filters select {
    font: 16px Barlow, sans-serif; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
  .more summary { cursor: pointer; color: var(--red); font-weight: 700; margin: 4px 0 8px; }
  .more-filters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 8px; }
  .more-filters label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .more-filters select {
    font: 16px Barlow, sans-serif; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; }
  .count { color: var(--muted); font-size: 14px; margin: 6px 0 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .count button { font: 600 14px Barlow, sans-serif; color: var(--red); background: none; border: 0; cursor: pointer; padding: 0; }

  /* edzők */
  .list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding-bottom: 40px; }
  .coach { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px;
           display: flex; gap: 16px; text-decoration: none; }
  .coach:hover { border-color: var(--muted); }
  .avatar { flex: none; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
            background: rgba(229,72,77,.16); color: var(--red); font: 700 26px "Barlow Condensed", sans-serif; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .coach h3 { font-size: 24px; display: flex; gap: 6px; align-items: center; }
  [data-theme="light"] .coach h3 { font-size: 20px; }
  .muted { color: var(--muted); font-size: 15px; }
  .verified { color: var(--green); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chips span { background: var(--chip); border-radius: 999px; padding: 3px 12px; font-size: 14px; }

  /* egy edző */
  .detail { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 28px; margin: 18px 0 40px; }
  .detail .head { display: flex; gap: 18px; align-items: center; }
  .detail .avatar { width: 96px; height: 96px; font-size: 40px; }
  .detail h2 { font-size: clamp(32px, 4vw, 48px); }
  .detail .bio { white-space: pre-line; margin: 18px 0 6px; }
  .detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 16px 0; }
  .detail dt { color: var(--muted); font-weight: 600; }
  .detail dd { margin: 0; }
  .contacts, .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .note { color: var(--muted); font-size: 14px; margin-top: 16px; }
  .back { display: inline-flex; align-items: center; gap: 6px; margin-top: 18px; font-weight: 700; color: var(--red);
          text-decoration: none; }
  .state { text-align: center; color: var(--muted); padding: 48px 0; }

  footer { border-top: 1px solid var(--line); padding: 32px 0 48px; color: var(--muted); font-size: 14px; }
  footer .wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  footer nav { margin-left: auto; font-weight: 500; }

  @media (max-width: 860px) {
    nav .hide-sm { display: none; }
    .filters, .more-filters { grid-template-columns: 1fr 1fr; }
    .filters .search { grid-column: 1 / -1; }
    .list { grid-template-columns: 1fr; }
    .detail .head { flex-direction: column; align-items: flex-start; }
    .detail dl { grid-template-columns: 1fr; gap: 0; }
    .detail dd { margin-bottom: 10px; }
    footer nav { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="../"><img src="../assets/logo.png" alt=""><span data-brand>GymBro</span></a>
    <nav>
      <a class="hide-sm" href="../" data-i18n="navHome">Főoldal</a>
      <button class="lang-btn" type="button" data-lang-toggle data-i18n="otherLang">English</button>
      <button class="icon-btn" type="button" data-theme-toggle title="Világos téma" aria-label="Világos téma">
        <span class="mi only-dark i-light-mode"></span>
        <span class="mi only-light i-dark-mode"></span>
      </button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="intro" id="intro">
    <div class="eyebrow" data-i18n="coachesEyebrow">Edzőkereső</div>
    <h1 data-i18n="coachesTitle">Találd meg az edződ</h1>
    <p data-i18n="coachesLead">Személyi edzők és online coachok, akik a GymBro-ban jelentkeztek, és akiket jóváhagytunk. A keresés a böngésződben történik: nem küldjük el, mit kerestél.</p>
  </div>
  <div id="view"><p class="state" data-i18n="coachesLoading">Betöltés…</p></div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 <span data-brand>GymBro</span></span>
    <nav>
      <a href="../privacy/index.html#hu" data-href-lang="../privacy/index.html#{lang}" data-i18n="footPrivacy">Adatvédelem</a>
      <a href="#" data-contact data-i18n="footContact">Kapcsolat</a>
    </nav>
  </div>
</footer>
<script src="../brand.js"></script>
<script src="../i18n.js"></script>
<script type="module" src="edzok.js"></script>
</body>
</html>
