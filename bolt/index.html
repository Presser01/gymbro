<!doctype html>
<html lang="hu" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bolt – {brand}</title>
<meta name="description" content="Raidmate pólók, pulóverek, nadrágok és kiegészítők: elöl kicsi jelvény, hátul nagy kabala.">
<link rel="icon" href="../assets/logo.png">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/icons.css">
<script>
  // A téma már az első kirajzolás előtt (ne villanjon).
  (function () {
    var t = new URLSearchParams(location.search).get('theme');
    if (t !== 'light' && t !== 'dark') {
      try { t = localStorage.getItem('theme'); } catch (e) {}
    }
    if (t !== 'light' && t !== 'dark') {
      t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* A bemutató oldal színei és betűi (index.html). */
  :root, [data-theme="dark"] {
    --bg: #0d0e10; --bg2: #121317; --card: #1a1b20; --line: #2a2b31;
    --text: #f3f3f5; --muted: #9b9ca3; --soft: #c9cad0; --header: rgba(13,14,16,.82);
    --red: #e5484d; --red2: #ff6b5b; --green: #2ec56b;
    --cta-bg: var(--red); --cta-fg: #fff; --cta-hover: var(--red2);
    --chip: rgba(255,255,255,.06);
    --stage-a: #34353c; --stage-b: #232429;
    --head: "Barlow Condensed", Barlow, sans-serif; --head-weight: 700;
    --head-case: uppercase; --head-spacing: -.01em;
    color-scheme: dark;
  }
  [data-theme="light"] {
    --bg: #fbfbfc; --bg2: #f2f2f4; --card: #ffffff; --line: #e6e6ea;
    --text: #111214; --muted: #66676e; --soft: #3d3e44; --header: rgba(251,251,252,.86);
    --cta-bg: #111214; --cta-fg: #fff; --cta-hover: #2b2c31;
    --chip: rgba(0,0,0,.05);
    --stage-a: #f0f0f2; --stage-b: #dfdfe3;
    --head: Barlow, system-ui, sans-serif; --head-weight: 600;
    --head-case: none; --head-spacing: -.02em;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 17px/1.6 Barlow, system-ui, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 20px; }
  h1, h2, h3 { font-family: var(--head); font-weight: var(--head-weight); letter-spacing: var(--head-spacing);
               line-height: 1.05; margin: 0; }
  h1, h2 { text-transform: var(--head-case); }
  .eyebrow { color: var(--red); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 13px; }
  .mi { width: 22px; height: 22px; }

  header { position: sticky; top: 0; z-index: 10; background: var(--header);
           backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  header .wrap { display: flex; align-items: center; gap: 18px; height: 64px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none;
          font-family: "Barlow Condensed"; font-weight: 700; font-size: 24px; letter-spacing: .02em; }
  .logo img { width: 34px; height: 34px; border-radius: 9px; }
  nav { margin-left: auto; display: flex; gap: 20px; align-items: center; font-weight: 600; font-size: 15px; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a:hover { color: var(--text); }
  .icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%;
              border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; padding: 0; }
  .icon-btn:hover { background: var(--bg2); }
  .lang-btn { font: 600 14px Barlow, sans-serif; color: var(--muted); background: none; border: 0; cursor: pointer; padding: 6px; }
  .lang-btn:hover { color: var(--text); }
  [data-theme="dark"] .only-light, [data-theme="light"] .only-dark { display: none; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px;
         font: 700 15px Barlow, sans-serif; text-decoration: none; border: 1.5px solid var(--line);
         background: transparent; color: var(--text); cursor: pointer; }
  [data-theme="light"] .btn { border-radius: 12px; }
  .btn.primary { background: var(--cta-bg); border-color: var(--cta-bg); color: var(--cta-fg); }
  .btn.primary:hover { background: var(--cta-hover); }

  .intro { padding: 48px 0 18px; }
  .intro h1 { font-size: clamp(40px, 6vw, 72px); }
  .intro p { color: var(--soft); max-width: 62ch; margin: 14px 0 0; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 18px; }
  .filters button { font: 600 15px Barlow, sans-serif; color: var(--muted); background: var(--chip);
                    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .filters button[aria-pressed="true"] { color: var(--cta-fg); background: var(--cta-bg); border-color: var(--cta-bg); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; margin-bottom: 28px; }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden;
          display: flex; flex-direction: column; }
  .item[hidden] { display: none; }
  .pic { position: relative; background: radial-gradient(circle at 50% 38%, var(--stage-a), var(--stage-b));
         aspect-ratio: 400 / 400; display: grid; place-items: center; }
  .pic svg { width: 88%; height: auto; filter: drop-shadow(0 10px 18px rgba(0,0,0,.28)); }
  .views { position: absolute; left: 12px; top: 12px; display: flex; gap: 4px; padding: 3px;
           background: rgba(0,0,0,.35); border-radius: 999px; }
  .views button { font: 700 13px Barlow, sans-serif; color: #fff; background: transparent; border: 0;
                  border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  .views button[aria-pressed="true"] { background: var(--red); }
  .info { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .head h3 { font-size: 26px; }
  .soon { font-size: 12px; font-weight: 700; border: 1px solid currentColor; border-radius: 6px; padding: 0 6px;
          color: var(--muted); white-space: nowrap; }
  .info p { margin: 0; color: var(--soft); font-size: 15px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row:last-child { margin-top: auto; }
  .lbl { color: var(--muted); font-size: 14px; font-weight: 600; min-width: 42px; }
  .swatches { display: flex; gap: 8px; }
  .sw { width: 28px; height: 28px; border-radius: 50%; background: var(--c); cursor: pointer;
        border: 2px solid var(--line); padding: 0; }
  .sw[aria-pressed="true"] { outline: 2px solid var(--red); outline-offset: 2px; }
  select { font: 600 15px Barlow, sans-serif; color: var(--text); background: var(--bg2);
           border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  .one { font-weight: 600; }
  .ask { margin-left: auto; padding: 8px 16px; }

  .note { background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; margin: 0 0 14px; }
  .note h3 { font-size: 24px; margin-bottom: 6px; }
  .note p { margin: 0; color: var(--soft); }

  footer { border-top: 1px solid var(--line); padding: 32px 0 48px; color: var(--muted); font-size: 14px; margin-top: 26px; }
  footer .wrap { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  footer nav { margin-left: auto; font-weight: 500; }

  @media (max-width: 860px) {
    nav .hide-sm { display: none; }
    footer nav { margin-left: 0; }
  }
  @media (max-width: 420px) {
    .wrap { padding: 0 16px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="logo" href="../"><img src="../assets/logo.png" alt=""><span data-brand>Raidmate</span></a>
    <nav>
      <a class="hide-sm" href="../" data-i18n="navHome">Főoldal</a>
      <a class="hide-sm" href="../edzok/" data-i18n="navCoaches">Edzők</a>
      <button class="lang-btn" type="button" data-lang-toggle data-i18n="otherLang">English</button>
      <button class="icon-btn" type="button" data-theme-toggle title="Világos téma" aria-label="Világos téma">
        <span class="mi only-dark i-light-mode"></span>
        <span class="mi only-light i-dark-mode"></span>
      </button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <div class="eyebrow" data-i18n="shopEyebrow">Bolt</div>
    <h1 data-i18n="shopTitle">Raidmate cuccok</h1>
    <p data-i18n="shopLead">Pólók, pulóverek, nadrágok és kiegészítők: elöl kicsi jelvény, hátul nagy kabala.</p>
  </div>
  <div class="filters" role="group">
    <button type="button" data-filter="all" data-i18n="shopAll">Mind</button>
    <button type="button" data-filter="tops" data-i18n="shopTops">Felsők</button>
    <button type="button" data-filter="bottoms" data-i18n="shopBottoms">Nadrágok</button>
    <button type="button" data-filter="extras" data-i18n="shopExtras">Kiegészítők</button>
  </div>
  <div class="grid" id="grid"></div>
  <section class="note">
    <h3 data-i18n="shopHowTitle">Hogyan működik?</h3>
    <p data-i18n="shopHowText">Fizetni még nem lehet.</p>
  </section>
  <section class="note">
    <h3 data-i18n="shopPrintTitle">A nyomatokról</h3>
    <p data-i18n="shopPrintText">Elöl kicsi, egyszínű jelvény, a felsők hátán a teljes kabala.</p>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 <span data-brand>Raidmate</span></span>
    <nav>
      <a href="../privacy/index.html#hu" data-href-lang="../privacy/index.html#{lang}" data-i18n="footPrivacy">Adatvédelem</a>
      <a href="#" data-contact data-i18n="footContact">Kapcsolat</a>
    </nav>
  </div>
</footer>
<script src="../brand.js"></script>
<script src="../i18n.js"></script>
<script src="shop.js"></script>
</body>
</html>
